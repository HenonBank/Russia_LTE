<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставайся на связи</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0a0c0f; color: #e0e0e0; margin: 0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 3rem; font-weight: 600; margin-bottom: 0.5rem; }
        h1 span { color: #4ade80; }
        .sub { color: #94a3b8; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        .card { background: #1e2128; padding: 1.2rem; border-radius: 12px; border: 1px solid #2d313a; }
        .card .value { font-size: 2rem; font-weight: 700; color: #4ade80; }
        .card .label { color: #94a3b8; font-size: 0.9rem; }
        .loading { color: #94a3b8; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Оставайся <span>на связи.</span></h1>
        <p class="sub">Живая панель мониторинга: подписки, Telegram-прокси, Open Source утилиты и измерение скорости прямо в браузере.</p>
        <div id="stats" class="grid">
            <div class="card"><div class="value" id="subs">—</div><div class="label">Подписки</div></div>
            <div class="card"><div class="value" id="configs">—</div><div class="label">Конфиги</div></div>
            <div class="card"><div class="value" id="active">—</div><div class="label">Активные</div></div>
            <div class="card"><div class="value" id="bs">—</div><div class="label">BS</div></div>
            <div class="card"><div class="value" id="tg">—</div><div class="label">TG-прокси</div></div>
            <div class="card"><div class="value" id="utils">—</div><div class="label">Утилиты</div></div>
        </div>
        <p id="status" class="loading" style="margin-top:1rem;">Загрузка…</p>
    </div>

    <script>
        // Парсим данные с целевого сайта
        async function fetchData() {
            const statusEl = document.getElementById('status');
            try {
                const response = await fetch('https://remainconnected.vercel.app/');
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                // Ищем значения по тексту меток
                const getValueByLabel = (labelText) => {
                    const elements = doc.querySelectorAll('div, span, p, h3, h4');
                    for (let el of elements) {
                        if (el.textContent.trim() === labelText) {
                            // Ищем число рядом или внутри родителя
                            const parent = el.closest('.card, .stat, .item, [class*="card"], [class*="stat"]') || el.parentElement;
                            if (parent) {
                                const match = parent.textContent.match(/(\d+)/);
                                if (match) return match[1];
                            }
                        }
                    }
                    return null;
                };

                // Альтернативный поиск — по всем числам в блоках с определёнными классами
                const allCards = doc.querySelectorAll('.card, .stat, [class*="stat"], [class*="card"]');
                const values = {};
                allCards.forEach(card => {
                    const text = card.textContent.trim();
                    if (text.includes('Подписки')) values.subs = (text.match(/(\d+)/) || [])[1];
                    if (text.includes('Конфиги')) values.configs = (text.match(/(\d+)/) || [])[1];
                    if (text.includes('Активные')) values.active = (text.match(/(\d+)/) || [])[1];
                    if (text.includes('BS')) values.bs = (text.match(/(\d+)/) || [])[1];
                    if (text.includes('TG-прокси')) values.tg = (text.match(/(\d+)/) || [])[1];
                    if (text.includes('Утилиты')) values.utils = (text.match(/(\d+)/) || [])[1];
                });

                // Если не нашли через карточки — ищем глобально
                const fallback = (id, label) => {
                    if (values[id] === undefined || values[id] === null) {
                        const val = getValueByLabel(label);
                        if (val) values[id] = val;
                    }
                };
                fallback('subs', 'Подписки');
                fallback('configs', 'Конфиги');
                fallback('active', 'Активные');
                fallback('bs', 'BS');
                fallback('tg', 'TG-прокси');
                fallback('utils', 'Утилиты');

                // Обновляем DOM
                document.getElementById('subs').textContent = values.subs ?? '0';
                document.getElementById('configs').textContent = values.configs ?? '0';
                document.getElementById('active').textContent = values.active ?? '0';
                document.getElementById('bs').textContent = values.bs ?? '0';
                document.getElementById('tg').textContent = values.tg ?? '0';
                document.getElementById('utils').textContent = values.utils ?? '0';

                statusEl.textContent = 'Данные загружены с remainconnected.vercel.app';
                statusEl.className = '';
            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Не удалось загрузить данные (CORS или сеть). Показаны значения по умолчанию.';
                statusEl.className = 'error';
            }
        }

        fetchData();
    </script>
</body>
</html>
